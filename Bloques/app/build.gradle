plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bloques.juego'
    compileSdk 34

    defaultConfig {
        applicationId "com.bloques.juego"
        minSdk 19          // Android 4.4 en adelante
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmado con la clave de depuración para poder instalarlo directo.
            // Para publicar en Play Store usa tu propia clave.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
